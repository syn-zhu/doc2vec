# Doc2Vec Configuration
embedding:
  provider: 'openai'
  dimension: 3072
  openai:
    model: 'text-embedding-3-large'

sources:
  # GitHub Sources
  - type: github
    product_name: 'istio'
    version: 'latest'
    repo: 'istio/istio'
    start_date: '2025-01-01'
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './istio-issues.db'

  # Website Sources
  - type: website
    product_name: 'ambient'
    version: 'latest'
    url: 'https://ambientmesh.io/docs/'
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './ambient.db'

  - type: website
    product_name: 'argo'
    version: 'latest'
    url: 'https://argo-cd.readthedocs.io/en/stable/'
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './argo.db'

  - type: website
    product_name: 'argo-rollouts'
    version: 'latest'
