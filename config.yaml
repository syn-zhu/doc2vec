    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './mongodb-atlas.db'

  # ── Platform-specific Code Sources ──

  - type: code
    source: github
    product_name: 'agentgateway'
    version: 'latest'
    repo: 'agentgateway/agentgateway'
    branch: 'main'
    include_extensions: ['.go', '.rs', '.toml', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './agentgateway-code.db'

  - type: code
    source: github
    product_name: 'agentregistry'
    version: 'latest'
    repo: 'agentregistry-dev/agentregistry'
    branch: 'main'
    include_extensions: ['.go', '.ts', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './agentregistry-code.db'

  - type: code
    source: github
    product_name: 'kagent'
    version: 'latest'
    repo: 'kagent-dev/kagent'
    branch: 'main'
    include_extensions: ['.go', '.py', '.ts', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './kagent-code.db'

  - type: code
    source: github
    product_name: 'kmcp'
    version: 'latest'
    repo: 'kagent-dev/kmcp'
    branch: 'main'
    include_extensions: ['.go', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './kmcp-code.db'

  - type: code
    source: github
    product_name: 'evermemos'
    version: 'latest'
    repo: 'EverMind-AI/EverMemOS'
    branch: 'main'
    include_extensions: ['.py', '.ts', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './evermemos-code.db'

  - type: code
    source: github
    product_name: 'istio'
    version: 'latest'
    repo: 'istio/istio'
    branch: 'master'
    include_extensions: ['.go', '.yaml', '.md']
    chunk_size: 512
    max_size: 1048576
    database_config:
      type: 'sqlite'
      params:
        db_path: './istio-code.db'